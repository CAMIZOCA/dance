name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dance
          POSTGRES_USER: dance
          POSTGRES_PASSWORD: dance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dance -d dance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: vendor/bin/pint --test
      - run: composer analyse
      - run: composer fresh-demo
      - name: Run PostgreSQL tests
        shell: bash
        run: |
          set +e
          php artisan test --configuration phpunit.postgres.xml --compact 2>&1 | tee postgres-test-output.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 80 postgres-test-output.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/:/%3A/g')
            echo "::error file=backend/phpunit.postgres.xml,line=1::PostgreSQL tests failed: ${summary}"
          fi

          exit "$status"
      - run: composer audit --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit
